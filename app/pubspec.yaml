name: scaner_app
description: "OBD scanner app for the ESP32-C5 adapter"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  web_socket_channel: ^3.0.3
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/kb/
    - assets/img/
    - assets/google_fonts/
